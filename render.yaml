# Cavix — FULL-PIPELINE deploy on Render (mostly free).
#
# This provisions the whole product:
#   • cavix              the website + dashboard (control-plane, Node)   [web, free]
#   • cavix-edge         GitHub webhook receiver (Go)                     [web, free]
#   • cavix-orchestrator the review engine (Node)                        [web, free]
#   • cavix-redis        the job queue (Key Value / Redis)               [free]
#   • cavix-db           Postgres, so accounts/reviews persist           [free]
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render → New + → Blueprint → pick this repo → Apply.
#   3. Fill in the few `sync: false` values (they can't be auto-generated):
#        - cavix:              CAVIX_ADMIN_EMAILS   = your email
#        - cavix-orchestrator: CAVIX_CONTROL_PLANE_URL = the cavix web service URL
#                              CAVIX_APP_ID, CAVIX_APP_PRIVATE_KEY  (GitHub App, §8B)
#   4. In your GitHub App (GUIDE §8B): set the Webhook URL to the cavix-edge URL
#      (…/webhook) and the Webhook secret to cavix-edge's generated CAVIX_WEBHOOK_SECRET
#      (view it in Render → cavix-edge → Environment).
#      Subscribe the App to BOTH events: "Pull request" AND "Issue comment"
#      (issue_comment is what delivers "@cavixcode review" — without it, commands
#      never reach Cavix at all).
#      Permissions: Pull requests = Read & write, Contents = Read, Metadata = Read.
#   5. Sign in to the site, open Repositories, and toggle ON each repo you want
#      reviewed. Cavix deliberately reviews nothing until you do.
#
# Checking it works: comment "@cavixcode review" on a pull request. Cavix reacts 👀
# within seconds, then 🚀 when the review posts. A 😕 means it failed and the reply
# comment says why. NO reaction at all means the webhook never arrived — check the
# GitHub App's "Recent Deliveries" page.
#
# JUST WANT THE FREE TRIAL SITE? Delete the cavix-edge, cavix-orchestrator, and
# cavix-redis service blocks (and their notes). The `cavix` web service + Postgres are
# fully self-contained — org owners bring their own AI key on the site (BYOK).
#
# Free-tier facts: free web services sleep after ~15 min idle and cold-start on the
# next request. Render's free Postgres/Redis are time-limited; swap in Neon/Supabase
# (Postgres) or Upstash (Redis) free for unlimited — just set DATABASE_URL / CAVIX_REDIS_URL.

databases:
  - name: cavix-db
    plan: free
    databaseName: cavix
    user: cavix

services:
  # ---------- job queue (Redis / Key Value) ----------
  - type: redis
    name: cavix-redis
    plan: free
    ipAllowList: []          # internal-only (no public access)

  # ---------- the website + dashboard (what org owners use) ----------
  - type: web
    name: cavix
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run control-plane
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL              # persistent storage (auto-wired)
        fromDatabase:
          name: cavix-db
          property: connectionString
      - key: CAVIX_SESSION_SECRET      # signs login cookies (auto-generated)
        generateValue: true
      - key: CAVIX_SECRET_KEY          # encrypts stored BYOK keys (auto-generated)
        generateValue: true
      - key: CAVIX_INTERNAL_TOKEN      # lets the orchestrator read org keys (auto-generated)
        generateValue: true
      - key: CAVIX_ADMIN_EMAILS        # YOUR email → founder Admin console
        sync: false
      # ONE GitHub App powers sign-in AND bot installs. From your GitHub App:
      #   • Client ID + a generated client secret  → the two vars below (sign-in)
      #   • App name (slug)                          → CAVIX_GITHUB_APP_SLUG (install button)
      # In the GitHub App settings set:
      #   • Callback URL = <this service URL>/api/auth/github/callback
      #   • Setup URL    = <this service URL>/app        (Redirect on update: on)
      # Leave blank to disable GitHub sign-in (email/password still works).
      - key: CAVIX_GITHUB_CLIENT_ID
        sync: false
      - key: CAVIX_GITHUB_CLIENT_SECRET
        sync: false
      - key: CAVIX_GITHUB_APP_SLUG
        sync: false
      - key: CAVIX_LLM_PROVIDER        # default provider a new org sees (optional)
        value: anthropic
      - key: CAVIX_LLM_MODEL           # default model a new org sees (optional)
        value: claude-opus-5

  # ---------- edge: receives GitHub webhooks, queues jobs ----------
  - type: web
    name: cavix-edge
    runtime: go
    plan: free
    region: oregon
    rootDir: services/edge
    buildCommand: go build -o edge ./cmd/edge
    startCommand: ./edge
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CAVIX_REDIS_URL           # queue connection (auto-wired, incl. password)
        fromService:
          name: cavix-redis
          type: redis
          property: connectionString
      - key: CAVIX_WEBHOOK_SECRET      # generated; paste this into your GitHub App webhook
        generateValue: true
      - key: CAVIX_BOT_HANDLE          # mention handles, comma-separated
        value: cavixcode,cavix
      # The other four hosts arrive on the SAME /webhook endpoint, each with its
      # own secret so no host's hook can forge another's. Leave any of these
      # unset and that host's deliveries are refused, which is the default.
      - key: CAVIX_GITLAB_WEBHOOK_SECRET     # GitLab project hook "Secret token"
        sync: false
      - key: CAVIX_BITBUCKET_WEBHOOK_SECRET  # Bitbucket Cloud webhook secret (HMAC)
        sync: false
      # Azure DevOps service hooks SIGN NOTHING: the only credential they can
      # carry is HTTP Basic, so this is the PASSWORD half of it. Put anything in
      # the username box.
      - key: CAVIX_AZURE_WEBHOOK_SECRET
        sync: false

  # ---------- orchestrator: runs the review, posts to GitHub ----------
  - type: web
    name: cavix-orchestrator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run orchestrator
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CAVIX_REDIS_URL           # same queue as the edge (auto-wired)
        fromService:
          name: cavix-redis
          type: redis
          property: connectionString
      - key: CAVIX_INTERNAL_TOKEN      # shared with the site (auto-copied)
        fromService:
          name: cavix
          type: web
          envVarKey: CAVIX_INTERNAL_TOKEN
      - key: CAVIX_CONTROL_PLANE_URL   # the cavix web service URL (paste after 1st deploy)
        sync: false
      # REQUIRED to post anything to GitHub. A GitHub App install never gives you a
      # token — the orchestrator signs a JWT with the App key and exchanges it for a
      # short-lived installation token on every review.
      #
      #   CAVIX_APP_ID = the NUMERIC "App ID" on your GitHub App's General page.
      #                  (NOT the Client ID, which starts with Iv1./Iv23.)
      #
      # For the private key you have two options. THE SECRET FILE IS MORE RELIABLE:
      # a .pem is multi-line, and pasting multi-line text into an env-var field is
      # the single most common way this breaks.
      #
      #   RECOMMENDED  Render → cavix-orchestrator → Environment → "Add Secret File"
      #                Filename: cavix.pem   Contents: the whole .pem
      #                then set CAVIX_APP_PRIVATE_KEY_FILE = /etc/secrets/cavix.pem
      #
      #   OR           CAVIX_APP_PRIVATE_KEY = the ENTIRE .pem contents, including
      #                the "-----BEGIN..." and "-----END..." lines.
      #
      # Cavix repairs the usual manglings (escaped \n, quotes, newlines flattened to
      # spaces, base64) and, if the key still cannot sign, it logs exactly what it
      # received and keeps running rather than failing the deploy.
      - key: CAVIX_APP_ID              # GitHub App id (GUIDE §8B)
        sync: false
      - key: CAVIX_APP_PRIVATE_KEY     # GitHub App .pem contents (GUIDE §8B)
        sync: false
      - key: CAVIX_APP_PRIVATE_KEY_FILE  # e.g. /etc/secrets/cavix.pem (preferred)
        sync: false
      - key: CAVIX_BOT_HANDLE          # answers to "@cavixcode review" and "@cavix review"
        value: cavixcode,cavix
      - key: CAVIX_SANDBOX_BACKEND     # "local" runs fine on Render's free box
        value: local
      # The other four hosts. Each needs no orchestrator secret: a workspace
      # pastes its access token in the dashboard under Integrations, and it is
      # held encrypted PER WORKSPACE rather than per deployment, because one
      # shared token would read every customer's repositories.
      #
      # These two only name a SELF-HOSTED instance. gitlab.com, bitbucket.org
      # and dev.azure.com are the defaults and need nothing here.
      - key: CAVIX_GITLAB_URL              # e.g. https://gitlab.acme.com
        sync: false
      - key: CAVIX_BITBUCKET_SERVER_URL    # e.g. https://bitbucket.acme.com (required for Data Center)
        sync: false
      - key: CAVIX_AZURE_URL               # e.g. https://tfs.acme.local/tfs (on-premises Azure DevOps Server)
        sync: false
