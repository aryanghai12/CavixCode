# Cavix — FULL-PIPELINE deploy on Render (mostly free).
#
# This provisions the whole product:
#   • cavix              the website + dashboard (control-plane, Node)   [web, free]
#   • cavix-edge         GitHub webhook receiver (Go)                     [web, free]
#   • cavix-orchestrator the review engine (Node)                        [web, free]
#   • cavix-redis        the job queue (Key Value / Redis)               [free]
#
# Postgres is NOT provisioned here. Bring your own (Neon's free tier does not
# expire, Render's does) and paste its URL into DATABASE_URL. See the note above
# the services block for why it is not wired automatically.
#
# How to use:
#   1. Push this repo to GitHub.
#   2. Render → New + → Blueprint → pick this repo → Apply.
#   3. Fill in the few `sync: false` values (they can't be auto-generated):
#        - cavix:              DATABASE_URL         = your Neon pooled URL
#                              CAVIX_SESSION_SECRET = openssl rand -hex 32
#                              CAVIX_SECRET_KEY     = openssl rand -hex 32
#                              CAVIX_ADMIN_EMAILS   = your email, or @your-github-login
#          Set the two secrets ONCE and never change them: CAVIX_SECRET_KEY is
#          the key to every stored API key and OAuth token, and rotating it makes
#          all of them undecryptable, which looks exactly like the data vanishing.
#        - cavix-orchestrator: CAVIX_CONTROL_PLANE_URL = the cavix web service URL
#                              CAVIX_APP_ID, CAVIX_APP_PRIVATE_KEY  (GitHub App, §8B)
#   4. In your GitHub App (GUIDE §8B): set the Webhook URL to the cavix-edge URL
#      (…/webhook) and the Webhook secret to cavix-edge's generated CAVIX_WEBHOOK_SECRET
#      (view it in Render → cavix-edge → Environment).
#      Subscribe the App to BOTH events: "Pull request" AND "Issue comment"
#      (issue_comment is what delivers "@cavixcode review" — without it, commands
#      never reach Cavix at all).
#      Permissions: Pull requests = Read & write, Contents = Read, Metadata = Read.
#   5. Sign in to the site, open Repositories, and toggle ON each repo you want
#      reviewed. Cavix deliberately reviews nothing until you do.
#
# Checking it works: comment "@cavixcode review" on a pull request. Cavix reacts 👀
# within seconds, then 🚀 when the review posts. A 😕 means it failed and the reply
# comment says why. NO reaction at all means the webhook never arrived — check the
# GitHub App's "Recent Deliveries" page.
#
# JUST WANT THE FREE TRIAL SITE? Delete the cavix-edge, cavix-orchestrator, and
# cavix-redis service blocks (and their notes). The `cavix` web service + Postgres are
# fully self-contained — org owners bring their own AI key on the site (BYOK).
#
# Free-tier facts: free web services sleep after ~15 min idle and cold-start on the
# next request. Render's free Postgres/Redis are time-limited; swap in Neon/Supabase
# (Postgres) or Upstash (Redis) free for unlimited — just set DATABASE_URL / CAVIX_REDIS_URL.

# NO `databases:` BLOCK, AND THAT IS DELIBERATE.
#
# There used to be a free Render Postgres declared here, with DATABASE_URL wired
# to it through `fromDatabase`. Two things went wrong with that, and both of them
# look identical from the outside: you log in and the workspace is empty.
#
#   1. Render's free Postgres expires. Once it does, DATABASE_URL still resolves,
#      to a database that no longer answers. The site boots, cannot reach it, and
#      serves an empty workspace from memory that is never saved anywhere.
#
#   2. `fromDatabase` OVERWRITES the variable every time the blueprint syncs. So
#      pointing the service at Neon in the dashboard worked right up until the
#      next deploy put the old Render URL back.
#
# DATABASE_URL is now set by hand (`sync: false` below) and nothing in this file
# competes with it. Paste Neon's pooled connection string, the one containing
# `-pooler`, with `?sslmode=require` on the end.
#
# ALREADY DEPLOYED FROM AN OLDER COPY OF THIS FILE? Applying this blueprint does
# NOT move your data, and it does not fill DATABASE_URL in for you: `sync: false`
# means Render leaves whatever is there alone, which is the whole point (it is
# also why this is safe to re-apply). If the old `fromDatabase` wiring is still
# in place, the service is pointed at the Render Postgres, so do this by hand,
# in this order:
#
#   1. Get the external connection string from whichever Postgres you are
#      keeping. From Neon that is the POOLED string (it contains `-pooler`) with
#      `?sslmode=require` appended. If the data you want still lives in the old
#      Render database and it has not expired yet, dump and restore it first:
#        pg_dump "<old Render external URL>" > cavix.sql
#        psql "<new Neon URL>" < cavix.sql
#      An expired free Render database cannot be dumped, and nothing here can
#      recover it. That is the failure this block exists to stop repeating.
#   2. Render Dashboard → the `cavix` service → Environment → set DATABASE_URL to
#      that string. Set it on the SERVICE, not in this file; a value committed
#      here is a connection string in git.
#   3. Save, then Manual Deploy → Deploy latest commit. A save alone restarts the
#      service, but deploy from the dashboard so the run you check is the run you
#      configured.
#   4. VERIFY, because every way this goes wrong looks identical from the browser
#      (you sign in and the workspace is empty):
#        - Logs: `persistence: target database` names the host you just set, and
#          `persistence: Postgres enabled` follows it. If instead you see
#          `Postgres could not be reached at startup`, the URL or the network is
#          wrong; the service keeps retrying for ~10 minutes and refuses writes
#          while it does, so nothing is being silently lost in the meantime.
#        - Open the site, confirm your orgs and repositories are there, then
#          restart the service once and confirm they are STILL there. A workspace
#          that survives a restart is the only proof that persistence is on.
#      Do not change CAVIX_SECRET_KEY or CAVIX_SESSION_SECRET during any of this.
#      Moving the database keeps the encrypted blobs; changing the key is what
#      makes them undecryptable, and the store reports an undecryptable blob as
#      "no credential", so BYOK keys and connected repos just look gone.
services:
  # ---------- job queue (Redis / Key Value) ----------
  - type: redis
    name: cavix-redis
    plan: free
    ipAllowList: []          # internal-only (no public access)

  # ---------- the website + dashboard (what org owners use) ----------
  - type: web
    name: cavix
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run control-plane
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Neon (or any Postgres). Set this in the dashboard; see the note above the
      # services block for why it is not wired automatically, and for the steps
      # to move an already-deployed service onto an external database.
      #
      # `sync: false` MUST STAY. It is what stops a later blueprint sync from
      # overwriting the value you set by hand, which is exactly how the previous
      # `fromDatabase` wiring kept resetting this service to a dead database.
      - key: DATABASE_URL
        sync: false

      # THESE TWO MUST NEVER CHANGE ONCE THE SITE HAS USERS.
      #
      # They were `generateValue: true`, which mints a fresh random value. That is
      # fine on the very first deploy and destructive afterwards, because both are
      # keys to data that is already stored:
      #
      #   CAVIX_SECRET_KEY encrypts every BYOK API key and every OAuth token in
      #   the database. Change it and none of those blobs decrypt any more. The
      #   store treats a blob that will not decrypt as "no credential" rather
      #   than as an error (see getOAuthToken and getPlatformToken), so nothing
      #   fails loudly: the owner simply finds their key gone and their
      #   repositories disconnected, and is asked to set them up again.
      #
      #   CAVIX_SESSION_SECRET signs login cookies. Change it and every session
      #   is invalidated at once.
      #
      # Generate each once with `openssl rand -hex 32`, set them here, and keep a
      # copy somewhere safe. Rotating CAVIX_SECRET_KEY without re-encrypting is a
      # data migration, not a config change.
      - key: CAVIX_SESSION_SECRET      # signs login cookies
        sync: false
      - key: CAVIX_SECRET_KEY          # encrypts stored BYOK keys and OAuth tokens
        sync: false
      - key: CAVIX_INTERNAL_TOKEN      # lets the orchestrator read org keys (auto-generated)
        generateValue: true
      # YOUR email, or your GitHub login written @login, → founder Admin console.
      # Prefer @login: if your GitHub email is private, GitHub returns no address
      # at sign-in and Cavix stores you under <login>@users.noreply.github.com,
      # so an email here would match nothing and the console never appears.
      # REQUIRED: left unset, nobody on this deployment is an admin.
      - key: CAVIX_ADMIN_EMAILS
        sync: false
      # ONE GitHub App powers sign-in AND bot installs. From your GitHub App:
      #   • Client ID + a generated client secret  → the two vars below (sign-in)
      #   • App name (slug)                          → CAVIX_GITHUB_APP_SLUG (install button)
      # In the GitHub App settings set:
      #   • Callback URL = <this service URL>/api/auth/github/callback
      #   • Setup URL    = <this service URL>/app        (Redirect on update: on)
      # Leave blank to disable GitHub sign-in (email/password still works).
      - key: CAVIX_GITHUB_CLIENT_ID
        sync: false
      - key: CAVIX_GITHUB_CLIENT_SECRET
        sync: false
      - key: CAVIX_GITHUB_APP_SLUG
        sync: false
      - key: CAVIX_LLM_PROVIDER        # default provider a new org sees (optional)
        value: anthropic
      - key: CAVIX_LLM_MODEL           # default model a new org sees (optional)
        value: claude-opus-5

  # ---------- edge: receives GitHub webhooks, queues jobs ----------
  - type: web
    name: cavix-edge
    runtime: go
    plan: free
    region: oregon
    rootDir: services/edge
    buildCommand: go build -o edge ./cmd/edge
    startCommand: ./edge
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CAVIX_REDIS_URL           # queue connection (auto-wired, incl. password)
        fromService:
          name: cavix-redis
          type: redis
          property: connectionString
      - key: CAVIX_WEBHOOK_SECRET      # generated; paste this into your GitHub App webhook
        generateValue: true
      - key: CAVIX_BOT_HANDLE          # mention handles, comma-separated
        value: cavixcode,cavix
      # The other four hosts arrive on the SAME /webhook endpoint, each with its
      # own secret so no host's hook can forge another's. Leave any of these
      # unset and that host's deliveries are refused, which is the default.
      - key: CAVIX_GITLAB_WEBHOOK_SECRET     # GitLab project hook "Secret token"
        sync: false
      - key: CAVIX_BITBUCKET_WEBHOOK_SECRET  # Bitbucket Cloud webhook secret (HMAC)
        sync: false
      # Azure DevOps service hooks SIGN NOTHING: the only credential they can
      # carry is HTTP Basic, so this is the PASSWORD half of it. Put anything in
      # the username box.
      - key: CAVIX_AZURE_WEBHOOK_SECRET
        sync: false
      # GitHub App installation lifecycle. These two let the edge forward
      # "somebody changed which repositories Cavix can see" to the service that
      # owns that record. Without them the edge accepts those events and drops
      # them, and Cavix only notices a change the next time a person opens the
      # Repositories page.
      - key: CAVIX_CONTROL_PLANE_URL   # the cavix web service URL (paste after 1st deploy)
        sync: false
      - key: CAVIX_INTERNAL_TOKEN      # shared with the site (auto-copied)
        fromService:
          name: cavix
          type: web
          envVarKey: CAVIX_INTERNAL_TOKEN

  # ---------- orchestrator: runs the review, posts to GitHub ----------
  - type: web
    name: cavix-orchestrator
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm run orchestrator
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CAVIX_REDIS_URL           # same queue as the edge (auto-wired)
        fromService:
          name: cavix-redis
          type: redis
          property: connectionString
      - key: CAVIX_INTERNAL_TOKEN      # shared with the site (auto-copied)
        fromService:
          name: cavix
          type: web
          envVarKey: CAVIX_INTERNAL_TOKEN
      - key: CAVIX_CONTROL_PLANE_URL   # the cavix web service URL (paste after 1st deploy)
        sync: false
      # REQUIRED to post anything to GitHub. A GitHub App install never gives you a
      # token — the orchestrator signs a JWT with the App key and exchanges it for a
      # short-lived installation token on every review.
      #
      #   CAVIX_APP_ID = the NUMERIC "App ID" on your GitHub App's General page.
      #                  (NOT the Client ID, which starts with Iv1./Iv23.)
      #
      # For the private key you have two options. THE SECRET FILE IS MORE RELIABLE:
      # a .pem is multi-line, and pasting multi-line text into an env-var field is
      # the single most common way this breaks.
      #
      #   RECOMMENDED  Render → cavix-orchestrator → Environment → "Add Secret File"
      #                Filename: cavix.pem   Contents: the whole .pem
      #                then set CAVIX_APP_PRIVATE_KEY_FILE = /etc/secrets/cavix.pem
      #
      #   OR           CAVIX_APP_PRIVATE_KEY = the ENTIRE .pem contents, including
      #                the "-----BEGIN..." and "-----END..." lines.
      #
      # Cavix repairs the usual manglings (escaped \n, quotes, newlines flattened to
      # spaces, base64) and, if the key still cannot sign, it logs exactly what it
      # received and keeps running rather than failing the deploy.
      - key: CAVIX_APP_ID              # GitHub App id (GUIDE §8B)
        sync: false
      - key: CAVIX_APP_PRIVATE_KEY     # GitHub App .pem contents (GUIDE §8B)
        sync: false
      - key: CAVIX_APP_PRIVATE_KEY_FILE  # e.g. /etc/secrets/cavix.pem (preferred)
        sync: false
      - key: CAVIX_BOT_HANDLE          # answers to "@cavixcode review" and "@cavix review"
        value: cavixcode,cavix
      - key: CAVIX_SANDBOX_BACKEND     # "local" runs fine on Render's free box
        value: local
      # Let a re-review read only the files a push changed, instead of the whole
      # pull request every time. Cheaper on long-running pull requests, and the
      # trade is real: a model asked a second time about untouched code might
      # find something it missed the first time. Findings already on the record
      # are carried by the ledger either way. Off unless you set it to "true".
      - key: CAVIX_NARROW_REREVIEWS
        value: "false"
      # The other four hosts. Each needs no orchestrator secret: a workspace
      # pastes its access token in the dashboard under Integrations, and it is
      # held encrypted PER WORKSPACE rather than per deployment, because one
      # shared token would read every customer's repositories.
      #
      # These two only name a SELF-HOSTED instance. gitlab.com, bitbucket.org
      # and dev.azure.com are the defaults and need nothing here.
      - key: CAVIX_GITLAB_URL              # e.g. https://gitlab.acme.com
        sync: false
      - key: CAVIX_BITBUCKET_SERVER_URL    # e.g. https://bitbucket.acme.com (required for Data Center)
        sync: false
      - key: CAVIX_AZURE_URL               # e.g. https://tfs.acme.local/tfs (on-premises Azure DevOps Server)
        sync: false
