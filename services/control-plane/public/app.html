<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard · Cavix</title>
<meta name="theme-color" content="#090D1A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css?v=50">
<link rel="stylesheet" href="/app.css?v=50">
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=50">
<link rel="apple-touch-icon" href="/cavix-mark.svg?v=50">
</head>
<body>

<!-- The same background planes the public site uses, so signing in does not
     drop you onto a different looking product. No particle field here: this is
     a work surface, and a drifting starfield behind a data table is noise. -->
<div class="aurora" id="aurora" aria-hidden="true">
  <span class="a1"></span><span class="a2"></span><span class="a3"></span><span class="a4"></span>
</div>
<div class="grid-plane" aria-hidden="true"></div>

<div class="cursor" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <a href="/" class="logo"><span class="logo-mark"><img src="/cavix-mark.svg?v=50" alt="" aria-hidden="true"></span> Cavix</a>
    <nav id="nav">
      <div class="nav-group">Workspace</div>
      <div class="nav-item" data-view="overview"><span class="ni-ico"></span> Overview</div>
      <div class="nav-item" data-view="reviews"><span class="ni-ico"></span> Reviews</div>
      <div class="nav-item" data-view="sample"><span class="ni-ico"></span> Sample review</div>
      <div class="nav-item" data-view="repos"><span class="ni-ico"></span> Repositories</div>
      <div class="nav-item" data-view="reports"><span class="ni-ico"></span> Reports</div>
      <div class="nav-item" data-view="learnings"><span class="ni-ico"></span> Learnings</div>
      <div class="nav-item" data-view="feed"><span class="ni-ico"></span> Proven catches</div>
      <div class="nav-group">Configure</div>
      <div class="nav-item" data-view="byok"><span class="ni-ico"></span> AI &amp; BYOK</div>
      <div class="nav-item" data-view="settings"><span class="ni-ico"></span> Review settings</div>
      <div class="nav-item" data-view="integrations"><span class="ni-ico"></span> Integrations</div>
      <div class="nav-item" data-view="team"><span class="ni-ico"></span> Team</div>
      <div class="nav-item" data-view="billing"><span class="ni-ico"></span> Plan &amp; billing</div>
      <div class="nav-group admin-only hidden">Founder</div>
      <div class="nav-item admin-only hidden" data-view="admin"><span class="ni-ico"></span> Admin console</div>
    </nav>
    <div class="sidebar-foot">
      <div class="user-chip">
        <div class="avatar" id="avatar">?</div>
        <div><div class="u-name" id="userName">…</div><div class="u-org" id="userOrg">…</div></div>
      </div>
      <button class="btn btn-glass btn-sm btn-block" id="logout" style="margin-top:10px">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <button class="btn btn-glass btn-sm mobile-menu" id="menuBtn" aria-label="Open navigation">Menu</button>
        <h1 id="viewTitle">Overview</h1>
        <div class="crumb" id="viewCrumb">Your review activity at a glance</div>
      </div>
      <a href="#" class="btn btn-primary btn-sm" id="topAction">Connect repository</a>
    </div>
    <div class="content" id="content"><div class="empty">Loading your workspace…</div></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="/icons.js?v=50"></script>
<script src="/pricing.js?v=50"></script>
<script src="/charts.js?v=50"></script>
<script src="/app.js?v=50"></script>
<script src="/motion.js?v=50"></script>
</body>
</html>
